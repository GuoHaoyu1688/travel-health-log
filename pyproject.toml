[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "travel-health-log"
version = "0.1.0"
description = "Private offline health and habit records for frequent travelers"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6", "defusedxml>=0.7", "fastapi>=0.115,<1", "uvicorn>=0.30", "mcp>=1.20,<2"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.11", "httpx>=0.27"]
[project.scripts]
thl = "travel_health_log.cli:main"
[tool.hatch.build.targets.wheel]
packages = ["src/travel_health_log"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
[tool.pytest.ini_options]
testpaths = ["tests"]
